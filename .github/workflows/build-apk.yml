name: Build APK and Release

on:
  push:
    branches:
      - "claude/**"
      - "main"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dil-ogrenme-debug-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dil Öğrenme build ${{ github.run_number }}
          body: |
            Automated debug build from commit ${{ github.sha }} on branch ${{ github.ref_name }}.
            Download the APK below and install it on your Android device (you may need to allow "install from unknown sources").
          files: ${{ steps.apk.outputs.path }}
          make_latest: true
